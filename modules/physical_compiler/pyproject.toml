[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nadit-physical-compiler"
version = "0.1.0"
description = "Physical circuit frontend and compilation interfaces for NADiT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit==2.6.0",
    "qiskit-qasm3-import==0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
    "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["qiskit.*", "qiskit_qasm3_import.*", "openqasm3.*"]
ignore_missing_imports = true
